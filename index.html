
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문장온 - AI 문장 분석</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>문장온 <span>文場ON</span></h1>
    <p>당신의 문장에 감정을 더하다.</p>
  </header>

  <main>
    <section class="intro">
      <h2>당신의 문장을 분석해 드립니다.</h2>
      <p>
        문장 속 감정과 분위기를 발견하고<br>
        더욱 풍부한 표현을 만들어 보세요.
      </p>
    </section>

    <section class="editor">
      <label for="userText">분석할 문장을 입력하세요.</label>
      <textarea id="userText"
        placeholder="여기에 직접 쓴 글을 입력해 보세요."></textarea>
      <button id="analyzeBtn">문장 분석하기 →</button>
    </section>

    <section id="result" class="result" hidden>
      <h2>문장 분석 결과</h2>

      <div class="analysis-card">
        <h3>🎭 감정 분석</h3>
        <div id="emotion"></div>
        <div id="emotionChart" class="chart"></div>
      </div>

      <div class="analysis-card">
        <h3>🌙 분위기 분석</h3>
        <div id="mood"></div>
      </div>

      <div class="analysis-card">
        <h3>📊 단어 사용 분석</h3>
        <div id="wordChart"></div>
      </div>

      <div class="analysis-card">
        <h3>✍️ 문장 개선 전후 비교</h3>
        <div id="beforeAfter"></div>
        <div id="suggestion"></div>
      </div>

      <div class="analysis-card">
        <h3>💡 비유적 표현 추천</h3>
        <div id="metaphor"></div>
      </div>

      <p class="notice">
        ※ 분석 결과는 단어 사전과 규칙을 활용한 참고용 결과입니다.
        감정 비중은 실제 감정의 확률을 의미하지 않습니다.
      </p>
    </section>
  </main>

  <footer>AI WRITING ASSISTANT · 문장온</footer>

  <script src="script.js"></script>
</body>
</html>
